[about]
headline = "Alice Acland, **founder.**"
intro = "I worked for ten years in public institutions and commercial galleries in London and Vienna, in curatorial and commercial roles, before founding Art Intelligence in early 2026."
paragraphs = [
  "I set up the consultancy because the tools available to arts organisations have multiplied faster than their ability to evaluate them. My work is to establish where AI and software are useful in a specific organisation, where they are not, and to put the useful parts into practice with the people who will use them.",
  "I deliver workshops on AI tools for arts professionals, and run my own business on the kind of systems I recommend: a Notion workspace, Gmail automations and an automated daily briefing.",
]
cv = [
  ["Public institutions", "Hayward Gallery, Victoria and Albert Museum, De Morgan Foundation"],
  ["Galleries and dealers", "Galerie Max Hetzler, Galerie Kandlhofer, Thomas Gibson Fine Art, Agency Gallery, Matthew Upham Antiques"],
  ["Education", "MA Curating the Art Museum, The Courtauld. BA History of Art, First Class, University of Leeds"],
  ["Based", "Vienna and London"],
]
example_heading = "An automated morning briefing."
example_text = "Each morning an AI agent searches for new stories on AI, technology and the art market, summarises each with its source, and drafts social media posts for review. Nothing is published automatically."
example_link = "https://theartintelligence.substack.com/p/how-to-set-up-a-personalised-daily"
principles_heading = "Three working principles."
principles = [
  ["Specific to each organisation", "Recommendations start from how your organisation works now. There is no standard package of tools."],
  ["Defined points of use", "AI is useful at specific, defined points in a workflow. It does not replace the judgement, relationships and expertise of your staff."],
  ["Clear about limits", "Some tools create more work than they save. Where that is the case, the recommendation is not to adopt them."],
]

