[services]
consultancy_heading = "An audit on its own, or an audit followed by implementation."
consultancy_intro = "The audit can cover a single workflow, such as post-sale, client management or shipping, or every system and process in the organisation."

option_one_title = "Audit"
option_one = [
  ["Delivers", "A map of how the organisation works, including its systems, tools and data, and an analysis of where time and data are lost"],
  ["Duration", "3 to 4 weeks"],
]
